name: quality
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: 'WebApp_Code/package-lock.json' }
      - run: npm ci
        working-directory: WebApp_Code
      - run: npm run check
        working-directory: WebApp_Code
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: 'WebApp_Code/apps/api/requirements.txt' }
      - run: pip install -r requirements.txt
        working-directory: WebApp_Code/apps/api
      - run: pytest
        working-directory: WebApp_Code/apps/api
